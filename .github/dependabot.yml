version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /
      - /bootstrap
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ["*"]
    commit-message:
      prefix: deps
